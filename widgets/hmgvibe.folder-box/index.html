<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="head">
    <button class="back" id="back" type="button" hidden aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <div class="crumbs" id="crumbs"></div>
    <span class="count w-label" id="count"></span>
  </header>
  <main class="box" id="box" data-no-drag data-no-menu tabindex="0">
    <div class="items" id="items"></div>
    <div class="note" id="note" hidden></div>
    <div class="drop" id="drop" aria-hidden="true"><span id="drop-text"></span></div>
  </main>
  <div class="setup" id="setup" hidden data-no-drag>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5V6a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8A1.5 1.5 0 0 1 20.5 8v1.5"/><path d="M3.5 9.5h17v8A2 2 0 0 1 18.5 19.5h-13a2 2 0 0 1-2-2z"/></svg>
    <b id="setup-title"></b>
    <span id="setup-text"></span>
    <button class="w-btn is-primary" id="setup-btn" type="button" hidden></button>
  </div>
  <div class="menu" id="menu" hidden role="menu" data-no-drag data-no-menu></div>
  <script src="main.js"></script>
</body>
</html>
